version: "3.8"

services:
  crm_model:
    image: "${VITE_ENTERPRISE_NAME}_template:${VITE_IMAGE_VERSION}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ENV: ${VITE_ENV}
        VITE_URL_DOTCORE: ${VITE_URL_DOTCORE}
        VITE_URL_AUTH_DOTCORE: ${VITE_URL_AUTH_DOTCORE}
        VITE_PLATFORM: ${VITE_PLATFORM}
        VITE_AES_KEY: ${VITE_AES_KEY}
        VITE_AES_IV: ${VITE_AES_IV}
        VITE_IMAGE_VERSION: ${VITE_IMAGE_VERSION}
        VITE_ENTERPRISE_NAME: ${VITE_ENTERPRISE_NAME}
        VITE_THEME_FILENAME: ${VITE_THEME_FILENAME}
        VITE_THEME_BLOBS_PATH: ${VITE_THEME_BLOBS_PATH}
        VITE_URL_CRM_DOTCORE: ${VITE_URL_CRM_DOTCORE}
        VITE_THEME_FAVICON: ${VITE_THEME_FAVICON}
        VITE_WS_PAYMENT_URL: ${VITE_WS_PAYMENT_URL}
        VITE_THEME_BLOBS_KEY: ${VITE_THEME_BLOBS_KEY}
        VITE_URL_API_CONVERT_TEMPLATE: ${VITE_URL_API_CONVERT_TEMPLATE}
        VITE_DOCKER_PORT: ${VITE_DOCKER_PORT}
        VITE_COMMUNICATIONHUB_URL: ${VITE_COMMUNICATIONHUB_URL}
        VITE_IDPARCEIRO: ${VITE_IDPARCEIRO}
    pull_policy: build
    environment:
      - VITE_ENV=${VITE_ENV}
      - VITE_URL_DOTCORE=${VITE_URL_DOTCORE}
      - VITE_URL_AUTH_DOTCORE=${VITE_URL_AUTH_DOTCORE}
      - VITE_PLATFORM=${VITE_PLATFORM}
      - VITE_AES_KEY=${VITE_AES_KEY}
      - VITE_AES_IV=${VITE_AES_IV}
      - VITE_IMAGE_VERSION=${VITE_IMAGE_VERSION}
      - VITE_ENTERPRISE_NAME=${VITE_ENTERPRISE_NAME}
      - VITE_THEME_FILENAME=${VITE_THEME_FILENAME}
      - VITE_THEME_BLOBS_PATH=${VITE_THEME_BLOBS_PATH}
      - VITE_URL_CRM_DOTCORE=${VITE_URL_CRM_DOTCORE}
      - VITE_THEME_FAVICON=${VITE_THEME_FAVICON}
      - VITE_WS_PAYMENT_URL=${VITE_WS_PAYMENT_URL}
      - VITE_THEME_BLOBS_KEY=${VITE_THEME_BLOBS_KEY}
      - VITE_URL_API_CONVERT_TEMPLATE=${VITE_URL_API_CONVERT_TEMPLATE}
      - VITE_DOCKER_PORT=${VITE_DOCKER_PORT}
      - VITE_COMMUNICATIONHUB_URL=${VITE_COMMUNICATIONHUB_URL}
      - VITE_IDPARCEIRO=${VITE_IDPARCEIRO}
    ports:
      - "${VITE_DOCKER_PORT}:80"
    network_mode: "bridge"