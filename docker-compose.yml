version: "3.8"

services:
  crm_model:
    image: "${VITE_ENTERPRISE_NAME:-crm}_template:${VITE_IMAGE_VERSION:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_ENV: ${VITE_ENV:-production}
        VITE_URL_DOTCORE: ${VITE_URL_DOTCORE:-http://localhost:5000/}
        VITE_URL_AUTH_DOTCORE: ${VITE_URL_AUTH_DOTCORE:-http://localhost:5000/}
        VITE_PLATFORM: ${VITE_PLATFORM:-1}
        VITE_AES_KEY: ${VITE_AES_KEY:-1234567890123456}
        VITE_AES_IV: ${VITE_AES_IV:-1234567890123456}
        VITE_IMAGE_VERSION: ${VITE_IMAGE_VERSION:-1.0.0}
        VITE_ENTERPRISE_NAME: ${VITE_ENTERPRISE_NAME:-nsf}
        VITE_THEME_FILENAME: ${VITE_THEME_FILENAME:-theme.css}
        VITE_THEME_BLOBS_PATH: ${VITE_THEME_BLOBS_PATH:-https://wkfkeepinsmarsh.blob.core.windows.net}
        VITE_URL_CRM_DOTCORE: ${VITE_URL_CRM_DOTCORE:-http://localhost:5000/}
        VITE_THEME_FAVICON: ${VITE_THEME_FAVICON:-favicon.png}
        VITE_WS_PAYMENT_URL: ${VITE_WS_PAYMENT_URL:-http://localhost:5000}
        VITE_THEME_BLOBS_KEY: ${VITE_THEME_BLOBS_KEY:-local}
        VITE_URL_API_CONVERT_TEMPLATE: ${VITE_URL_API_CONVERT_TEMPLATE:-http://localhost:5000}
        VITE_DOCKER_PORT: ${VITE_DOCKER_PORT:-80}
        VITE_COMMUNICATIONHUB_URL: ${VITE_COMMUNICATIONHUB_URL:-http://localhost:5000}
        VITE_IDPARCEIRO: ${VITE_IDPARCEIRO:-1}
    pull_policy: build
    environment:
      - VITE_USE_MOCK=${VITE_USE_MOCK:-true}
      - VITE_ENV=${VITE_ENV:-production}
      - VITE_URL_DOTCORE=${VITE_URL_DOTCORE:-http://localhost:5000/}
      - VITE_URL_AUTH_DOTCORE=${VITE_URL_AUTH_DOTCORE:-http://localhost:5000/}
      - VITE_PLATFORM=${VITE_PLATFORM:-1}
      - VITE_AES_KEY=${VITE_AES_KEY:-1234567890123456}
      - VITE_AES_IV=${VITE_AES_IV:-1234567890123456}
      - VITE_IMAGE_VERSION=${VITE_IMAGE_VERSION:-1.0.0}
      - VITE_ENTERPRISE_NAME=${VITE_ENTERPRISE_NAME:-nsf}
      - VITE_THEME_FILENAME=${VITE_THEME_FILENAME:-theme.css}
      - VITE_THEME_BLOBS_PATH=${VITE_THEME_BLOBS_PATH:-https://wkfkeepinsmarsh.blob.core.windows.net}
      - VITE_URL_CRM_DOTCORE=${VITE_URL_CRM_DOTCORE:-http://localhost:5000/}
      - VITE_THEME_FAVICON=${VITE_THEME_FAVICON:-favicon.png}
      - VITE_WS_PAYMENT_URL=${VITE_WS_PAYMENT_URL:-http://localhost:5000}
      - VITE_THEME_BLOBS_KEY=${VITE_THEME_BLOBS_KEY:-local}
      - VITE_URL_API_CONVERT_TEMPLATE=${VITE_URL_API_CONVERT_TEMPLATE:-http://localhost:5000}
      - VITE_DOCKER_PORT=${VITE_DOCKER_PORT:-80}
      - VITE_COMMUNICATIONHUB_URL=${VITE_COMMUNICATIONHUB_URL:-http://localhost:5000}
      - VITE_IDPARCEIRO=${VITE_IDPARCEIRO:-1}
    ports:
      - "${VITE_DOCKER_PORT:-80}:80"
    network_mode: "bridge"